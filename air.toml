root = "." # The root directory of the project
tmp_dir = "tmp" # The temporary directory where air will store its temporary files

[build] # The build configuration
  bin = "main" # The name of the binary file to be generated after building the project
  cmd = "go build -o main main.go" # The command to build the project
  exclude_dir = ["tmp", "client"]  # Specifies the directories to be excluded from monitoring for changes
  include_ext = ["**/*.go"] # Specifies the file patterns to be included for monitoring.
  # ignore = ["tmp/*"] # Specifies the files or directories to be ignored when triggering a build.

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true